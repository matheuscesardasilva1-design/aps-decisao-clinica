name: Sync TelessaúdeRS-UFRGS (Perguntas da Semana)

on:
  schedule:
    # Executa toda segunda-feira e quinta-feira às 03:00 UTC (00:00 BRT)
    # Também mantém o projeto gratuito do Supabase ativo sem pausar por inatividade.
    - cron: "0 3 * * 1,4"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Quantidade de páginas de listagem a verificar"
        required: false
        default: "2"
      max_new:
        description: "Máximo de novas perguntas por execução"
        required: false
        default: "15"

permissions:
  contents: read

jobs:
  sync-telessaude:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Instalar dependências Python
        run: pip install -r scripts/requirements.txt

      - name: Executar captura do TelessaúdeRS-UFRGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/scraper_telessaude.py \
            --max-pages "${{ github.event.inputs.max_pages || '2' }}" \
            --max-new "${{ github.event.inputs.max_new || '15' }}" \
            --delay 4.0
